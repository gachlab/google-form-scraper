# Temporary. Prints the OIDC claims npm receives, so the Trusted Publisher form
# can be filled in with the exact values instead of guesses. Never prints the
# token itself. Delete once publishing works.
name: OIDC debug

on:
  workflow_dispatch:

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Show the claims npm will validate
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('npm:registry.npmjs.org');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8'),
            );
            for (const key of [
              'iss', 'aud', 'repository', 'repository_owner',
              'workflow', 'workflow_ref', 'job_workflow_ref',
              'environment', 'ref', 'ref_type', 'event_name', 'sub',
            ]) {
              core.info(`${key.padEnd(18)} = ${claims[key] ?? '(ausente)'}`);
            }
